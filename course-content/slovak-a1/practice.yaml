course: slovak-a1

# Практическое продолжение темы. Теория объясняется в живом чате,
# затем AI использует эти задания по одному и переводит ученика в диалог.
practice:
  - lesson_slug: greetings
    exercises:
      - type: translation
        question: "Переведи: Доброе утро!"
        answer: "Dobré ráno"
      - type: translation
        question: "Переведи: До свидания!"
        answer: "Dovidenia"
      - type: dialogue
        instruction: "Сценарий: ты входишь в офис утром. Поздоровайся вежливо, спроси, как дела, и попрощайся."
        question: "Начни диалог с фразы Dobrý deň."

  - lesson_slug: introductions
    exercises:
      - type: translation
        question: "Переведи: Я из России и живу в Санкт-Петербурге."
        answer: "Som z Ruska a bývam v Petrohrade"
      - type: translation
        question: "Переведи: Приятно познакомиться."
        answer: "Teší ma"
      - type: dialogue
        instruction: "Сценарий: познакомься с новым коллегой. Назови имя, страну, город и спроси его имя."
        question: "Начни знакомство с Volám sa Sergej."

  - lesson_slug: numbers
    exercises:
      - type: translation
        question: "Переведи: У меня пять книг."
        answer: "Mám päť kníh"
      - type: translation
        question: "Переведи: У нас четыре кофе."
        answer: "Máme štyri kávy"
      - type: dialogue
        instruction: "Сценарий: продавец спрашивает Koľko? Назови количество книг, яблок и бутылок воды."
        question: "Ответь тремя короткими предложениями с числами 2, 4 и 5."

  - lesson_slug: days-and-months
    exercises:
      - type: translation
        question: "Переведи: Сегодня пятница."
        answer: "Dnes je piatok"
      - type: translation
        question: "Переведи: В понедельник я работаю."
        answer: "V pondelok pracujem"
      - type: dialogue
        instruction: "Сценарий: договорись о встрече. Скажи, какой сегодня день и когда ты свободен."
        question: "Спроси: Kedy sa stretneme?"

  - lesson_slug: personal-pronouns
    exercises:
      - type: translation
        question: "Переведи: Они работают."
        answer: "Oni pracujú"
      - type: translation
        question: "Переведи: Мы учимся."
        answer: "My sa učíme"
      - type: dialogue
        instruction: "Сценарий: расскажи о себе и двух друзьях. Используй ja, my и oni."
        question: "Составь три предложения с разными местоимениями."

  - lesson_slug: verb-byt
    exercises:
      - type: translation
        question: "Переведи: Ты дома?"
        answer: "Si doma?"
      - type: translation
        question: "Переведи: Они не из Братиславы."
        answer: "Nie sú z Bratislavy"
      - type: dialogue
        instruction: "Сценарий: коротко выясни, кто собеседник, где он находится и откуда он."
        question: "Задай три вопроса с Kto?, Kde? и Odkiaľ?"

  - lesson_slug: masculine-nouns
    exercises:
      - type: translation
        question: "Переведи: Это новый телефон."
        answer: "To je nový telefón"
      - type: translation
        question: "Переведи: У меня есть хлеб."
        answer: "Mám chlieb"
      - type: dialogue
        instruction: "Сценарий: опиши продавцу три мужских предмета, которые хочешь купить."
        question: "Используй конструкции Chcem... и Mám..."

  - lesson_slug: feminine-nouns
    exercises:
      - type: translation
        question: "Переведи: Это новая работа."
        answer: "To je nová práca"
      - type: translation
        question: "Переведи: Я пью воду."
        answer: "Pijem vodu"
      - type: dialogue
        instruction: "Сценарий: в магазине назови три женских существительных и согласуй их с dobrá, nová или veľká."
        question: "Составь короткий заказ."

  - lesson_slug: neuter-nouns
    exercises:
      - type: translation
        question: "Переведи: Это маленькое яблоко."
        answer: "To je malé jablko"
      - type: translation
        question: "Переведи: Город большой."
        answer: "Mesto je veľké"
      - type: dialogue
        instruction: "Сценарий: расскажи другу о городе, машине и упражнении."
        question: "Скажи три предложения со словами mesto, auto и cvičenie."

  - lesson_slug: singular-and-plural
    exercises:
      - type: translation
        question: "Переведи: Два дома и пять яблок."
        answer: "Dva domy a päť jabĺk"
      - type: translation
        question: "Переведи: В городе три машины."
        answer: "V meste sú tri autá"
      - type: dialogue
        instruction: "Сценарий: опиши комнату с одним столом, двумя книгами и пятью яблоками."
        question: "Скажи, сколько предметов находится в комнате."

  - lesson_slug: noun-endings
    exercises:
      - type: translation
        question: "Переведи: Одна бутылка, две бутылки, пять бутылок."
        answer: "Jedna fľaša, dve fľaše, päť fliaš"
      - type: translation
        question: "Переведи: Одно яблоко, два яблока, пять яблок."
        answer: "Jedno jablko, dve jablká, päť jabĺk"
      - type: dialogue
        instruction: "Сценарий: покупка продуктов. Попроси разное количество бутылок, яблок и булочек."
        question: "Используй формы после 1, 2–4 и 5+."

  - lesson_slug: adjective-gender
    exercises:
      - type: translation
        question: "Переведи: Это хорошая книга."
        answer: "To je dobrá kniha"
      - type: translation
        question: "Переведи: Это большое окно."
        answer: "To je veľké okno"
      - type: dialogue
        instruction: "Сценарий: опиши в магазине три предмета, каждый с подходящим прилагательным."
        question: "Используй мужской, женский и средний род."

  - lesson_slug: adjective-plural
    exercises:
      - type: translation
        question: "Переведи: Новые книги."
        answer: "Nové knihy"
      - type: translation
        question: "Переведи: Хорошие друзья."
        answer: "Dobrí priatelia"
      - type: dialogue
        instruction: "Сценарий: расскажи о своих вещах и друзьях. Отдельно назови предметы и людей."
        question: "Сделай четыре коротких предложения во множественном числе."

  - lesson_slug: demonstratives-and-possessives
    exercises:
      - type: translation
        question: "Переведи: Моя новая книга."
        answer: "Moja nová kniha"
      - type: translation
        question: "Переведи: Этот большой дом."
        answer: "Tento veľký dom"
      - type: dialogue
        instruction: "Сценарий: объясни другу, какие предметы принадлежат тебе."
        question: "Используй môj, moja, moje и ten, tá, to."

  - lesson_slug: nominative
    exercises:
      - type: translation
        question: "Переведи: Сергей — инженер."
        answer: "Sergej je inžinier"
      - type: translation
        question: "Переведи: Книга новая."
        answer: "Kniha je nová"
      - type: dialogue
        instruction: "Сценарий: представь человека и предметы вокруг него, используя именительный падеж."
        question: "Опиши комнату тремя предложениями."

  - lesson_slug: accusative
    exercises:
      - type: translation
        question: "Переведи: Я вижу хорошую женщину."
        answer: "Vidím dobrú ženu"
      - type: translation
        question: "Переведи: Я покупаю новый телефон."
        answer: "Kupujem nový telefón"
      - type: dialogue
        instruction: "Сценарий: расскажи продавцу, что ты видишь и что хочешь купить."
        question: "Используй vidím и kupujem с тремя объектами."

  - lesson_slug: basic-prepositions
    exercises:
      - type: translation
        question: "Переведи: Я живу в городе."
        answer: "Bývam v meste"
      - type: translation
        question: "Переведи: Я иду из магазина."
        answer: "Idem z obchodu"
      - type: dialogue
        instruction: "Сценарий: объясни туристу, где ты находишься, откуда пришёл и куда идёшь."
        question: "Используй v, z и do."

  - lesson_slug: present-tense
    exercises:
      - type: translation
        question: "Переведи: Я работаю и учусь."
        answer: "Pracujem a učím sa"
      - type: translation
        question: "Переведи: Они живут в Братиславе."
        answer: "Bývajú v Bratislave"
      - type: dialogue
        instruction: "Сценарий: расскажи собеседнику о своём обычном дне."
        question: "Используй четыре глагола в настоящем времени."

  - lesson_slug: irregular-verbs
    exercises:
      - type: translation
        question: "Переведи: Я знаю словацкий."
        answer: "Viem po slovensky"
      - type: translation
        question: "Переведи: Я хочу кофе."
        answer: "Chcem kávu"
      - type: dialogue
        instruction: "Сценарий: в кафе скажи, что хочешь, что можешь и что знаешь."
        question: "Используй chcem, môžem и viem."

  - lesson_slug: reflexive-verbs
    exercises:
      - type: translation
        question: "Переведи: Я учусь по-словацки."
        answer: "Učím sa po slovensky"
      - type: translation
        question: "Переведи: Как тебя зовут?"
        answer: "Ako sa voláš?"
      - type: dialogue
        instruction: "Сценарий: короткий разговор о самочувствии и учёбе."
        question: "Используй Ako sa máš? и Učím sa..."

  - lesson_slug: family
    exercises:
      - type: translation
        question: "Переведи: У меня есть брат и сестра."
        answer: "Mám brata a sestru"
      - type: translation
        question: "Переведи: Моя мама дома."
        answer: "Moja mama je doma"
      - type: dialogue
        instruction: "Сценарий: расскажи новому знакомому о своей семье."
        question: "Назови минимум трёх родственников и где они находятся."

  - lesson_slug: home
    exercises:
      - type: translation
        question: "Переведи: На кухне есть стол."
        answer: "V kuchyni je stôl"
      - type: translation
        question: "Переведи: Моя комната маленькая."
        answer: "Moja izba je malá"
      - type: dialogue
        instruction: "Сценарий: проведи друга по квартире и назови комнаты и предметы."
        question: "Опиши кухню и комнату четырьмя предложениями."

  - lesson_slug: shopping
    exercises:
      - type: translation
        question: "Переведи: Сколько стоит хлеб?"
        answer: "Koľko stojí chlieb?"
      - type: translation
        question: "Переведи: Мне, пожалуйста, две бутылки воды."
        answer: "Prosím si dve fľaše vody"
      - type: dialogue
        instruction: "Сценарий: покупка в магазине. Продавец приветствует тебя, ты спрашиваешь цену и делаешь заказ."
        question: "Проведи диалог из четырёх реплик и закончи словами To je všetko."

  - lesson_slug: food
    exercises:
      - type: translation
        question: "Переведи: Я люблю мясо и овощи."
        answer: "Mám rád mäso a zeleninu"
      - type: translation
        question: "Переведи: Я не люблю грибы."
        answer: "Nemám rád huby"
      - type: dialogue
        instruction: "Сценарий: расскажи другу, что ты любишь и не любишь есть."
        question: "Назови три любимых продукта и один нелюбимый."

  - lesson_slug: restaurant
    exercises:
      - type: translation
        question: "Переведи: Я возьму два кофе."
        answer: "Dám si dve kávy"
      - type: translation
        question: "Переведи: Счёт, пожалуйста."
        answer: "Účet, prosím"
      - type: dialogue
        instruction: "Сценарий: заказ в кафе. Официант приветствует тебя, ты заказываешь еду, напиток и просишь счёт."
        question: "Проведи короткий диалог с čašník."

  - lesson_slug: transport
    exercises:
      - type: translation
        question: "Переведи: Я еду на работу автобусом."
        answer: "Idem do práce autobusom"
      - type: translation
        question: "Переведи: Где находится остановка?"
        answer: "Kde je zastávka?"
      - type: dialogue
        instruction: "Сценарий: спроси дорогу к вокзалу и уточни, на каком автобусе ехать."
        question: "Начни с Prosím vás, kde je...?"

  - lesson_slug: work
    exercises:
      - type: translation
        question: "Переведи: Я работаю в IT."
        answer: "Pracujem v IT"
      - type: translation
        question: "Переведи: Мой коллега новый."
        answer: "Môj kolega je nový"
      - type: dialogue
        instruction: "Сценарий: первый день на работе. Представься коллеге, назови должность и спроси, где находится офис."
        question: "Проведи диалог из пяти коротких реплик."

  - lesson_slug: hobbies
    exercises:
      - type: translation
        question: "Переведи: В свободное время я играю в видеоигры."
        answer: "Vo voľnom čase hrám videohry"
      - type: translation
        question: "Переведи: Я изучаю математику."
        answer: "Študujem matematiku"
      - type: dialogue
        instruction: "Сценарий: познакомься с человеком и обсуди хобби и свободное время."
        question: "Спроси Čo rád robíš vo voľnom čase? и ответь на вопрос."

  - lesson_slug: regular-past
    exercises:
      - type: translation
        question: "Переведи: Вчера я работал."
        answer: "Včera som pracoval"
      - type: translation
        question: "Переведи: Она училась дома."
        answer: "Včera sa učila doma"
      - type: dialogue
        instruction: "Сценарий: расскажи коллеге, что ты делал вчера утром и вечером."
        question: "Используй два правильных глагола в прошедшем времени."

  - lesson_slug: irregular-past
    exercises:
      - type: translation
        question: "Переведи: Вчера я был дома."
        answer: "Včera som bol doma"
      - type: translation
        question: "Переведи: Мы пошли в магазин."
        answer: "Išli sme do obchodu"
      - type: dialogue
        instruction: "Сценарий: друг спрашивает, где ты был и что делал вчера."
        question: "Ответь тремя предложениями с bol, mal и išiel."

  - lesson_slug: talking-about-yesterday
    exercises:
      - type: translation
        question: "Переведи: Вчера я встал, позавтракал и пошёл на работу."
        answer: "Včera som vstal, naraňajkoval som sa a išiel som do práce"
      - type: translation
        question: "Переведи: Вечером я был дома."
        answer: "Večer som bol doma"
      - type: dialogue
        instruction: "Сценарий: расскажи преподавателю о вчерашнем дне по порядку от утра до вечера."
        question: "Составь рассказ из пяти предложений и задай преподавателю один вопрос."
