course:
  slug: math-exam-prep
  title: Математика · подготовка к экзамену
  subject: mathematics
  language: ru
  teaching_language: ru
  level: preparation

modules:
  - slug: arithmetic
    title: "1. Числа, проценты и порядок действий"
    order: 1
    lessons:
      - slug: order-of-operations
        title: "Порядок действий и отрицательные числа"
        order: 1
        objectives:
          - вспомнить порядок арифметических действий
          - уверенно работать с отрицательными числами
        theory:
          - "Сначала выполняй действия в скобках, затем степени, умножение и деление, после — сложение и вычитание."
          - "При сложении чисел с разными знаками вычти меньший модуль из большего и оставь знак числа с большим модулем."
          - "Пример: -7 + 12 = 5; 3 - 8 = -5; 4 × (-6) = -24."
        exercises:
          - type: numeric_answer
            question: "Вычисли: 18 - 3 × (4 + 2)"
            answer: "0"
          - type: numeric_answer
            question: "Вычисли: -15 + 8 - 6"
            answer: "-13"
          - type: numeric_answer
            question: "Вычисли: (-7) × 5 + 9"
            answer: "-26"
      - slug: percentages
        title: "Проценты и пропорции"
        order: 2
        objectives:
          - находить процент от числа
          - восстанавливать число по его проценту
        theory:
          - "p% от числа a равно a × p / 100."
          - "Если известно, что b составляет p% от числа, исходное число равно b × 100 / p."
          - "Процентное изменение считают от первоначального значения."
        exercises:
          - type: numeric_answer
            question: "Найди 15% от 240."
            answer: "36"
          - type: numeric_answer
            question: "После скидки 20% цена стала 800. Какой была цена до скидки?"
            answer: "1000"
          - type: numeric_answer
            question: "Число увеличили с 80 до 100. На сколько процентов оно выросло?"
            answer: "25"
  - slug: fractions
    title: "2. Дроби и десятичные числа"
    order: 2
    lessons:
      - slug: fraction-operations
        title: "Обыкновенные дроби"
        order: 1
        objectives:
          - складывать и умножать дроби
          - сокращать результат
        theory:
          - "Для сложения дробей приведи их к общему знаменателю."
          - "При умножении умножай числители и знаменатели, затем сократи дробь."
          - "Ответ можно вводить как дробь, например 3/4, или как конечную десятичную дробь."
        exercises:
          - type: numeric_answer
            question: "Вычисли: 1/3 + 1/6"
            answer: "1/2"
          - type: numeric_answer
            question: "Вычисли: 3/4 × 2/3"
            answer: "1/2"
          - type: numeric_answer
            question: "Вычисли: 5/6 - 1/4"
            answer: "7/12"
      - slug: decimals
        title: "Десятичные дроби"
        order: 2
        objectives:
          - переводить дроби в десятичную запись
          - выполнять вычисления с десятичными дробями
        theory:
          - "Десятичные дроби можно складывать и вычитать, выравнивая запятые."
          - "Для проверки полезно оценить порядок результата до точного вычисления."
          - "В поле ответа допустимы запятая или точка: 0,75 и 0.75 равнозначны."
        exercises:
          - type: numeric_answer
            question: "Вычисли: 2,75 + 0,6"
            answer: "3.35"
          - type: numeric_answer
            question: "Вычисли: 4,2 ÷ 0,7"
            answer: "6"
          - type: numeric_answer
            question: "Запиши десятичной дробью: 3/8"
            answer: "0.375"
  - slug: powers
    title: "3. Степени и корни"
    order: 3
    lessons:
      - slug: powers
        title: "Свойства степеней"
        order: 1
        objectives:
          - применять правила степеней
          - не путать сложение и умножение степеней
        theory:
          - "При умножении степеней с одинаковым основанием показатели складывают: a^m × a^n = a^(m+n)."
          - "При делении показатели вычитают: a^m / a^n = a^(m-n), если a не равно нулю."
          - "Степень степени: (a^m)^n = a^(m×n)."
        exercises:
          - type: numeric_answer
            question: "Вычисли: 2^3 × 2^4"
            answer: "128"
          - type: numeric_answer
            question: "Вычисли: 5^4 ÷ 5^2"
            answer: "25"
          - type: numeric_answer
            question: "Вычисли: (3^2)^2"
            answer: "81"
      - slug: square-roots
        title: "Квадратный корень"
        order: 2
        objectives:
          - находить квадратный корень из точных квадратов
          - связывать корень и возведение в квадрат
        theory:
          - "Квадратный корень из неотрицательного числа a — неотрицательное число, квадрат которого равен a."
          - "Например, √49 = 7, потому что 7² = 49."
          - "√(a²) = |a|, поэтому результат корня не бывает отрицательным."
        exercises:
          - type: numeric_answer
            question: "Вычисли: √196"
            answer: "14"
          - type: numeric_answer
            question: "Вычисли: √(81/16)"
            answer: "9/4"
          - type: numeric_answer
            question: "Вычисли: √0,49"
            answer: "0.7"
  - slug: linear-equations
    title: "4. Линейные уравнения"
    order: 4
    lessons:
      - slug: one-step-equations
        title: "Простые линейные уравнения"
        order: 1
        objectives:
          - находить неизвестное одним обратным действием
          - проверять подстановкой
        theory:
          - "Чтобы сохранить равенство, выполняй одно и то же действие с обеими частями уравнения."
          - "После нахождения x обязательно подставь ответ в исходное уравнение."
          - "В ответе вводи только значение x, без записи «x =»."
        exercises:
          - type: numeric_answer
            question: "Реши уравнение: x + 17 = 42. Введи значение x."
            answer: "25"
          - type: numeric_answer
            question: "Реши уравнение: 6x = 54. Введи значение x."
            answer: "9"
          - type: numeric_answer
            question: "Реши уравнение: x/5 = -3. Введи значение x."
            answer: "-15"
      - slug: two-step-equations
        title: "Уравнения в два действия"
        order: 2
        objectives:
          - раскрывать простую последовательность обратных действий
          - не терять знак при переносе
        theory:
          - "Сначала убери свободное слагаемое, затем раздели или умножь обе части на коэффициент при x."
          - "Не нужно «переносить со сменой знака» механически: это сокращённая запись прибавления или вычитания одного и того же числа из обеих частей."
          - "Если ответ — дробь, введи её в виде a/b."
        exercises:
          - type: numeric_answer
            question: "Реши уравнение: 3x + 5 = 26. Введи значение x."
            answer: "7"
          - type: numeric_answer
            question: "Реши уравнение: 4x - 9 = 19. Введи значение x."
            answer: "7"
          - type: numeric_answer
            question: "Реши уравнение: 5x + 2 = 0. Введи значение x."
            answer: "-2/5"
  - slug: functions-and-graphs
    title: "5. Функции и графики"
    order: 5
    lessons:
      - slug: linear-functions
        title: "Линейная функция и её график"
        order: 1
        objectives:
          - подставлять значение x в формулу y = kx + b
          - понимать, как коэффициенты k и b меняют прямую
        theory:
          - "Линейная функция записывается как y = kx + b. Чтобы найти y, подставь данное x и выполни вычисления."
          - "k показывает наклон прямой: при положительном k график растёт слева направо, при отрицательном — убывает."
          - "b — значение y при x = 0: это точка, где прямая пересекает ось y."
        exercises:
          - type: numeric_answer
            question: "Для y = 2x + 1 найди y при x = 3."
            answer: "7"
          - type: numeric_answer
            question: "Для y = -3x + 4 найди y при x = 2."
            answer: "-2"
          - type: numeric_answer
            question: "Для y = 5x - 6 найди y при x = 0."
            answer: "-6"
      - slug: quadratic-functions
        title: "Квадратичная функция"
        order: 2
        objectives:
          - находить значение y для y = x² и y = x² + b
          - связывать формулу квадрата с параболой
        theory:
          - "График функции y = x² называется параболой. Для каждого x сначала возведи x в квадрат."
          - "У параболы y = x² вершина находится в точке (0; 0); значения y не бывают отрицательными."
          - "В y = x² + b число b сдвигает всю параболу вверх или вниз."
        exercises:
          - type: numeric_answer
            question: "Для y = x² найди y при x = 4."
            answer: "16"
          - type: numeric_answer
            question: "Для y = x² - 5 найди y при x = 3."
            answer: "4"
          - type: numeric_answer
            question: "Для y = x² + 2 найди y при x = -2."
            answer: "6"
