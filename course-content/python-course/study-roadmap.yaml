roadmap:
  title: "Python · четыре части"
  note: "Иди по порядку: сначала базовый синтаксис, затем структуры данных, профессиональные инструменты и специализация."
  topics:
    - slug: part-1
      title: "Часть 1 · Основы"
      description: "print, переменные, ввод, условия, циклы, списки и функции."
      module_slug: part-1-foundations
    - slug: part-2
      title: "Часть 2 · Данные и ООП"
      description: "Строки, словари, файлы, модули, обработка ошибок и классы."
      module_slug: part-2-core
    - slug: part-3
      title: "Часть 3 · Профессиональный Python"
      description: "Генераторы, декораторы, API, базы, параллельность и тесты."
      module_slug: part-3-professional
    - slug: part-4
      title: "Часть 4 · Специализация"
      description: "Regex, веб, данные, визуализация, боты, GUI и публикация."
      module_slug: part-4-specialization
