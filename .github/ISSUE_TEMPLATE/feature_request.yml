name: Предложение улучшения
description: Предложите проверяемое улучшение платформы
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает идея?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и ограничения
  - type: checkboxes
    id: checks
    attributes:
      label: Подтверждение
      options:
        - label: Я не включил(а) секреты, персональные данные или приватные учебные ответы.
          required: true